[vars]
AGENDA_ACCESS_TEAM_DOMAIN = "SUBSTITUA.cloudflareaccess.com"
AGENDA_ACCESS_AUD = "db3bf93cc578d6b95e128a8d1b875c0b6801c6745527832400a19b617b68078e"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "agenda-pericial-imagens"
