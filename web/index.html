<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Pericial</title>
<link rel="stylesheet" href="style.css?v=botao-compacto-1">
<header><div class="brand"><span>AP</span><div>Agenda Pericial<small>Gestão de laudos</small></div></div><div class="actions"><button type="button" id="import-config" hidden>Importar configurações</button><input type="file" id="config-file" accept=".json,application/json" hidden><span class="demo" id="account">Carregando</span><button id="perita" hidden>Configurar perita</button><button id="refresh">Atualizar</button><form method="post" action="/auth/sair" id="sign-out" hidden><button type="submit">Sair</button></form></div></header>
<main>
<section class="intro"><div><h1>Agenda de perícias</h1><p>Organize os processos por data e acompanhe cada laudo até a entrega.</p></div><button class="primary" id="new-date" disabled>＋ Nova data</button></section>
<section class="stats" id="stats" aria-label="Resumo"></section>
<section class="toolbar"><h2 id="board-title">Perícias por data</h2><div class="filters"><label>Etapas <select id="stage-filter"><option value="all">Todas as etapas</option><option value="adan">ADAN</option><option value="wes">WES</option></select></label><button type="button" id="archive-view" aria-pressed="false">Consultar arquivados</button><input id="search" type="search" placeholder="Buscar processo ou vara" aria-label="Buscar processo ou vara"><label><input type="checkbox" id="urgent"> Prazos próximos e atrasados</label></div></section>
<div class="board" id="board"></div>
<p class="foot">Os prazos são exibidos no painel. Atualize para ver alterações feitas na outra conta.</p>
</main>
<dialog id="dialog"><div id="panel"></div></dialog>
<div id="notice" role="status"></div>
<script src="assets/pdf-lib.min.js"></script><script src="assets/fontkit.umd.min.js"></script><script src="laudo-padrao.js?v=9"></script><script src="editor.js?v=pincel-atalhos-cv"></script><script src="rich-pdf.js?v=cloudflare-2"></script><script src="app.js?v=cartoes-modelos-1"></script>
</html>
